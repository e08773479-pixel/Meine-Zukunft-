<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101B3D">
<meta name="description" content="MOSTAQBALI — تعلّم اليوم لتصنع مستقبلك.">
<title>MOSTAQBALI | المستقبلي</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
:root {
  --navy: #101B3D;
  --deep: #09122B;
  --blue: #2864F0;
  --purple: #7957E8;
  --white: #FFFFFF;
  --muted: #C0C9E1;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  font-family: "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
  background: var(--deep);
  color: var(--white);
}

button {
  font: inherit;
}

button:focus-visible {
  outline: 3px solid #A8C5FF;
  outline-offset: 4px;
}

.intro {
  position: relative;
  isolation: isolate;
  display: grid;
  place-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 30px 20px;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 15% 18%, rgba(40,100,240,.22), transparent 38%),
    radial-gradient(ellipse at 85% 82%, rgba(121,87,232,.23), transparent 40%),
    linear-gradient(145deg, #09122B 0%, #101B3D 52%, #151B48 100%);
}

.background-orbit {
  position: absolute;
  z-index: -2;
  width: min(85vw, 700px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    transparent 0 12%,
    rgba(40,100,240,.18) 22%,
    rgba(121,87,232,.25) 36%,
    transparent 49% 63%,
    rgba(40,100,240,.16) 78%,
    transparent 90%
  );
  animation: rotateOrbit 16s linear infinite;
}

.background-orbit::before,
.background-orbit::after {
  content: "";
  position: absolute;
  inset: 10%;
  border: 1px solid rgba(170,190,255,.17);
  border-radius: 50%;
}

.background-orbit::after {
  inset: 22%;
  border-color: rgba(170,190,255,.11);
}

.background-glow {
  position: absolute;
  z-index: -1;
  width: min(55vw, 430px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: rgba(40,100,240,.17);
  filter: blur(65px);
  animation: breathe 4s ease-in-out infinite;
}

.intro-content {
  width: min(100%, 600px);
  text-align: center;
  animation: appear .8s ease both;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 92px;
  height: 92px;
  margin: 0 auto 25px;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 29px;
  background: linear-gradient(145deg, var(--blue), var(--purple));
  box-shadow:
    0 20px 70px rgba(40,100,240,.3),
    inset 0 1px 0 rgba(255,255,255,.35);
  transform: rotate(-5deg);
}

.brand-mark svg {
  width: 60px;
  height: 60px;
  transform: rotate(5deg);
}

.brand-name {
  direction: ltr;
  font-family: "Segoe UI", Arial, sans-serif;
  font-size: clamp(2rem, 8vw, 3.6rem);
  font-weight: 800;
  letter-spacing: .09em;
  line-height: 1.2;
  color: #FFFFFF;
  text-shadow: 0 5px 35px rgba(80,120,255,.2);
}

.brand-name span {
  background: linear-gradient(90deg, #FFFFFF, #B9D0FF 55%, #C8BAFF);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.arabic-name {
  margin-top: 12px;
  color: #DCE5FF;
  font-size: 1.15rem;
  font-weight: 700;
}

.tagline {
  margin-top: 14px;
  color: var(--muted);
  font-size: clamp(.9rem, 3vw, 1.08rem);
  line-height: 1.9;
}

.orbit-stage {
  position: relative;
  display: grid;
  place-items: center;
  width: 160px;
  height: 160px;
  margin: 30px auto 22px;
}

.orbit-ring {
  position: absolute;
  inset: 0;
  border: 1px solid rgba(183,201,255,.25);
  border-radius: 50%;
  animation: rotateOrbit 5s linear infinite;
}

.orbit-ring::before,
.orbit-ring::after {
  content: "";
  position: absolute;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #8EB5FF;
  box-shadow: 0 0 18px rgba(142,181,255,.9);
}

.orbit-ring::before {
  top: 14px;
  left: 27px;
}

.orbit-ring::after {
  right: 9px;
  bottom: 36px;
  width: 7px;
  height: 7px;
  background: #B9A6FF;
}

.orbit-ring.second {
  inset: 14px;
  border-style: dashed;
  border-color: rgba(121,87,232,.55);
  animation-direction: reverse;
  animation-duration: 8s;
}

.orbit-ring.second::before {
  top: 20px;
  right: 12px;
  left: auto;
  background: #B9A6FF;
}

.orbit-ring.second::after {
  right: auto;
  bottom: 12px;
  left: 24px;
}

.orbit-core {
  display: grid;
  place-items: center;
  width: 82px;
  height: 82px;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--blue), var(--purple));
  box-shadow:
    0 0 0 10px rgba(255,255,255,.035),
    0 0 55px rgba(67,103,244,.4);
  animation: breathe 3s ease-in-out infinite;
}

.orbit-core svg {
  width: 44px;
  height: 44px;
}

.learning-line {
  min-height: 34px;
  color: #E4EAFF;
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  font-size: clamp(.92rem, 3.5vw, 1.08rem);
  font-weight: 700;
  line-height: 1.8;
  animation: fadeIn .4s ease;
}

.learning-line .separator {
  padding-inline: 7px;
  color: #A99AFF;
}

.progress-track {
  width: min(220px, 65%);
  height: 4px;
  margin: 23px auto 0;
  overflow: hidden;
  border-radius: 20px;
  background: rgba(255,255,255,.13);
}

.progress-bar {
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--blue), #A28AFF);
  animation: loadProgress 5s linear forwards;
}

.loading-note {
  margin-top: 12px;
  color: #9DAACA;
  font-size: .78rem;
  line-height: 1.8;
}

.continue-button {
  position: absolute;
  right: 22px;
  bottom: max(20px, env(safe-area-inset-bottom));
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 11px 17px;
  color: #E4EAFF;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 999px;
  background: rgba(255,255,255,.06);
  cursor: pointer;
  transition: background .2s ease, transform .2s ease;
}

.continue-button:hover {
  background: rgba(255,255,255,.13);
  transform: translateY(-2px);
}

.continue-button:active {
  transform: scale(.97);
}

.error-message {
  display: none;
  margin-top: 12px;
  color: #FFDCDC;
  font-size: .85rem;
}

.error-message.visible {
  display: block;
}

@keyframes rotateOrbit {
  to { transform: rotate(360deg); }
}

@keyframes breathe {
  0%, 100% { transform: scale(.96); opacity: .86; }
  50% { transform: scale(1.04); opacity: 1; }
}

@keyframes appear {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes loadProgress {
  from { width: 0; }
  to { width: 100%; }
}

@media (max-width: 480px) {
  .brand-mark {
    width: 78px;
    height: 78px;
    border-radius: 25px;
  }

  .brand-mark svg {
    width: 51px;
    height: 51px;
  }

  .orbit-stage {
    width: 142px;
    height: 142px;
    margin-top: 25px;
  }

  .orbit-core {
    width: 72px;
    height: 72px;
  }

  .continue-button {
    right: 14px;
  }
}

@media (max-height: 650px) {
  .brand-mark {
    width: 66px;
    height: 66px;
    margin-bottom: 15px;
  }

  .brand-mark svg {
    width: 43px;
    height: 43px;
  }

  .orbit-stage {
    width: 115px;
    height: 115px;
    margin-top: 17px;
    margin-bottom: 12px;
  }

  .orbit-core {
    width: 62px;
    height: 62px;
  }

  .tagline {
    margin-top: 8px;
  }

  .progress-track {
    margin-top: 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<main class="intro" aria-label="شاشة بداية منصة المستقبلي">
  <div class="background-orbit" aria-hidden="true"></div>
  <div class="background-glow" aria-hidden="true"></div>

  <section class="intro-content">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 17.5C12 14.46 14.46 12 17.5 12H46.5C49.54 12 52 14.46 52 17.5V39.5C52 42.54 49.54 45 46.5 45H31L19 53V45H17.5C14.46 45 12 42.54 12 39.5V17.5Z" stroke="white" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M22 32V23L32 32L42 23V32" stroke="white" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="brand-name"><span>MOSTAQBALI</span></h1>
    <p class="arabic-name">المستقبلي</p>
    <p class="tagline">تعلّم اليوم، واصنع مستقبلك بثقة.</p>

    <div class="orbit-stage" aria-hidden="true">
      <div class="orbit-ring"></div>
      <div class="orbit-ring second"></div>
      <div class="orbit-core">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 17.5L24 9L41 17.5L24 26L7 17.5Z" stroke="white" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M13 21V30.5C19.5 36 28.5 36 35 30.5V21" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M41 18V29" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="41" cy="32" r="2" fill="white"/>
        </svg>
      </div>
    </div>

    <p class="learning-line" id="learningLine" aria-live="polite">
      Learn Something New <span class="separator">•</span> تعلّم شيئًا جديدًا
    </p>

    <div class="progress-track" role="progressbar" aria-label="Loading">
      <div class="progress-bar"></div>
    </div>

    <p class="loading-note" id="loadingNote">Preparing your learning journey…</p>
    <p class="error-message" id="errorMessage" role="status">
      لم نتمكن من فتح صفحة الدخول تلقائيًا. اضغط على زر المتابعة.
    </p>
  </section>

  <button class="continue-button" id="continueButton" type="button">
    متابعة <span aria-hidden="true">←</span>
  </button>
</main>

<script>
(function () {
  "use strict";

  const AUTH_PAGE = "auth.html";
  const INTRO_DURATION = 5000;

  const phrases = [
    'Learn Something New <span class="separator">•</span> تعلّم شيئًا جديدًا',
    'Discover Your Potential <span class="separator">•</span> اكتشف قدراتك',
    'Build Your Future <span class="separator">•</span> اصنع مستقبلك',
    'Your Journey Starts Here <span class="separator">•</span> رحلتك تبدأ هنا'
  ];

  const learningLine = document.getElementById("learningLine");
  const loadingNote = document.getElementById("loadingNote");
  const errorMessage = document.getElementById("errorMessage");
  const continueButton = document.getElementById("continueButton");

  let phraseIndex = 0;
  let navigationStarted = false;

  function openLogin() {
    if (navigationStarted) return;

    navigationStarted = true;
    loadingNote.textContent = "Opening your learning space…";

    window.location.assign(AUTH_PAGE);

    window.setTimeout(function () {
      if (document.visibilityState === "visible") {
        navigationStarted = false;
        errorMessage.classList.add("visible");
        continueButton.textContent = "فتح صفحة الدخول مجددًا ←";
      }
    }, 1400);
  }

  continueButton.addEventListener("click", openLogin);

  window.setInterval(function () {
    phraseIndex = (phraseIndex + 1) % phrases.length;
    learningLine.innerHTML = phrases[phraseIndex];
  }, 1200);

  window.setTimeout(openLogin, INTRO_DURATION);

  window.addEventListener("error", function () {
    errorMessage.classList.add("visible");
    continueButton.textContent = "متابعة إلى تسجيل الدخول ←";
  });
})();
</script>
</body>
  </html>
